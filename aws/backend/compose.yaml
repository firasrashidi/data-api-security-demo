services:
  backend:
    build: .
    restart: unless-stopped
    env_file:
      - /opt/secure-api/backend.env
    ports:
      - "127.0.0.1:8080:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /home/node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then((response) => process.exit(response.status === 401 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:2026.10.5
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - quic
      - --edge-ip-version
      - "4"
      - run
    env_file:
      - /opt/secure-api/tunnel.env
    environment:
      TUNNEL_TRANSPORT_PROTOCOL: quic
